<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>第4课 · AI用得好不好，差在第二句话｜AI入门 · 互动课</title>
<style>
  :root{
    --bg:#FAFAF9;--bg-2:#F4F4F2;--surface:#FFF;--text:#0A0A0A;--text-2:#52525B;--text-3:#8A8A93;
    --line:#E7E7E4;--line-2:#D6D6D1;--accent:#2B59FF;--accent-ink:#1E40D8;--accent-soft:rgba(43,89,255,.08);
    --accent-ring:rgba(43,89,255,.28);--ok:#15803D;--ok-soft:rgba(21,128,61,.08);--warn:#B45309;--warn-soft:rgba(180,83,9,.08);
    --err:#DC2626;--err-soft:rgba(220,38,38,.07);
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
    --r-sm:8px;--r:12px;--r-lg:16px;--r-full:999px;
    --sh-2:0 1px 2px rgba(10,10,10,.04),0 8px 24px -8px rgba(10,10,10,.08);
    --ease:cubic-bezier(.2,.7,.2,1);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.75}
  button{font:inherit;cursor:pointer}
  .app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}

  /* 左侧步骤导航 */
  .side{background:var(--surface);border-right:1px solid var(--line);padding:24px 18px;position:sticky;top:0;height:100vh;overflow:auto}
  .side .back{display:inline-block;font-size:13px;color:var(--text-2);text-decoration:none;margin-bottom:14px}
  .side .back:hover{color:var(--accent)}
  .saveerr{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--err);color:#fff;font-size:13px;padding:8px 16px;border-radius:var(--r-full);z-index:10}
  .side .course{font-size:12px;color:var(--text-3);letter-spacing:.04em}
  .side h1{font-size:17px;line-height:1.5;margin:6px 0 4px}
  .side .proto{display:inline-block;font-size:12px;color:var(--warn);background:var(--warn-soft);border-radius:var(--r-full);padding:1px 10px;margin-bottom:12px}
  .bar{height:6px;background:var(--bg-2);border-radius:var(--r-full);overflow:hidden;margin:6px 0 18px}
  .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s var(--ease)}
  .steps{list-style:none;margin:0;padding:0}
  .steps li{display:flex;gap:10px;align-items:flex-start;padding:7px 8px;border-radius:var(--r-sm);font-size:14px;color:var(--text-3);line-height:1.5}
  .steps li.can{cursor:pointer;color:var(--text-2)}
  .steps li.can:hover{background:var(--bg-2)}
  .steps li.cur{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
  .steps .dot{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line-2);font-size:11px;display:grid;place-items:center;margin-top:1px}
  .steps li.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
  .steps li.cur .dot{border-color:var(--accent);color:var(--accent)}
  .steps .sub{display:block;font-size:12px;font-weight:400;color:var(--text-3)}
  .reset{margin-top:18px;background:none;border:0;color:var(--text-3);font-size:12px;text-decoration:underline}

  /* 主区域 */
  .main{padding:40px 48px 80px;max-width:880px;width:100%}
  .tag{display:inline-block;font-size:12px;color:var(--accent-ink);background:var(--accent-soft);border-radius:var(--r-full);padding:2px 10px;margin-bottom:10px}
  h2{font-size:26px;line-height:1.4;margin:0 0 16px}
  h3{font-size:18px;margin:24px 0 10px}
  p{margin:0 0 14px;color:var(--text-2)}
  p strong,li strong{color:var(--text)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:28px 30px;box-shadow:var(--sh-2);animation:in .35s var(--ease)}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .quote{border-left:3px solid var(--accent);background:var(--bg-2);padding:12px 16px;border-radius:0 var(--r-sm) var(--r-sm) 0;margin:0 0 16px;color:var(--text)}
  .big{font-size:20px;color:var(--text);font-weight:600;line-height:1.6;margin:18px 0}
  .muted{color:var(--text-3);font-size:14px}
  .nav{display:flex;justify-content:space-between;align-items:center;margin-top:26px;gap:12px}
  .btn{border:1px solid var(--line-2);background:var(--surface);color:var(--text);padding:9px 20px;border-radius:var(--r-full);font-size:15px;transition:.2s var(--ease)}
  .btn:hover{border-color:var(--text-3)}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.pri:hover{background:var(--accent-ink)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .link{background:none;border:0;color:var(--text-3);font-size:14px;text-decoration:underline;padding:0}

  /* 选项 */
  .opts{display:grid;gap:10px;margin:16px 0}
  .opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 16px;color:var(--text);line-height:1.6;transition:.2s var(--ease)}
  .opt:hover:not(:disabled){border-color:var(--accent-ring);background:var(--accent-soft)}
  .opt:disabled{cursor:default}
  .opt.sel{border-color:var(--accent);background:var(--accent-soft)}
  .opt.right{border-color:var(--ok);background:var(--ok-soft)}
  .opt.wrong{border-color:var(--err);background:var(--err-soft)}
  .opt .k{display:inline-block;width:22px;font-weight:700;color:var(--text-3)}
  .fb{border-radius:var(--r);padding:14px 16px;margin:12px 0;animation:in .3s var(--ease);font-size:15px;line-height:1.7}
  .fb.ok{background:var(--ok-soft);border:1px solid rgba(21,128,61,.2)}
  .fb.no{background:var(--warn-soft);border:1px solid rgba(180,83,9,.2)}
  .fb.info{background:var(--accent-soft);border:1px solid var(--accent-ring)}
  .fb b{display:block;margin-bottom:4px}

  /* 分类题 */
  .cls{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:12px 0;background:var(--surface)}
  .cls .q{color:var(--text);margin-bottom:10px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-full);padding:4px 14px;font-size:14px}
  .chip:hover:not(:disabled){border-color:var(--accent-ring)}
  .chip.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
  .chip.wrong{border-color:var(--err);background:var(--err-soft);color:var(--err)}

  /* 案例分支 */
  .cases{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0}
  .case{border:1.5px solid var(--line);border-radius:var(--r-lg);padding:18px;background:var(--surface);text-align:left;position:relative;transition:.2s var(--ease)}
  .case:hover{border-color:var(--accent);transform:translateY(-2px)}
  .case .who{font-size:18px;font-weight:700;color:var(--text)}
  .case .role{font-size:13px;color:var(--text-3);margin-bottom:8px}
  .case .dir{font-size:13px;color:var(--accent-ink)}
  .case .ok{position:absolute;top:12px;right:12px;font-size:12px;color:var(--ok);background:var(--ok-soft);border-radius:var(--r-full);padding:0 8px}

  /* 对话 */
  .chat{display:flex;flex-direction:column;gap:12px;margin:16px 0}
  .msg{max-width:88%;padding:11px 15px;border-radius:14px;font-size:15px;line-height:1.7;white-space:pre-wrap;animation:in .3s var(--ease)}
  .msg.u{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
  .msg.a{align-self:flex-start;background:var(--bg-2);color:var(--text);border-bottom-left-radius:4px}
  .msg .who{display:block;font-size:12px;opacity:.7;margin-bottom:2px}
  .msg .line{display:block;padding:3px 6px;margin:2px -6px;border-radius:6px}
  .msg .line.pick{cursor:pointer}
  .msg .line.pick:hover{background:var(--accent-soft)}
  .msg .line.bad{background:var(--err-soft);text-decoration:underline wavy var(--err)}
  .msg .line.miss{background:var(--warn-soft)}
  .msgtag{align-self:flex-end;font-size:12px;margin-top:-6px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .msgtag span{border-radius:var(--r-full);padding:0 8px}
  .msgtag .g{color:var(--ok);background:var(--ok-soft)}
  .msgtag .w{color:var(--warn);background:var(--warn-soft)}
  .typing{align-self:flex-start;color:var(--text-3);font-size:14px}
  .composer{display:flex;gap:10px;align-items:flex-end;border:1.5px solid var(--line);border-radius:var(--r);padding:8px;background:var(--surface)}
  .composer:focus-within{border-color:var(--accent)}
  .composer textarea{flex:1;border:0;outline:0;resize:none;font:inherit;font-size:15px;min-height:44px;max-height:160px;padding:4px 6px;background:transparent}
  .hints{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
  .hints .chip{font-size:13px}
  .goal{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 0}
  .goal span{font-size:13px;border-radius:var(--r-full);padding:2px 10px;background:var(--bg-2);color:var(--text-3)}
  .goal span.on{background:var(--ok-soft);color:var(--ok)}
  .sim{font-size:12px;color:var(--warn)}

  /* 工具卡 */
  .tools{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:16px 0}
  .tool{border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;background:var(--bg)}
  .tool h4{margin:0 0 8px;font-size:16px}
  .tool ol{margin:0;padding-left:20px;color:var(--text-2);font-size:15px}
  .tool li{margin:4px 0}

  /* 点评 */
  .score{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}
  .score div{border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:center;background:var(--bg)}
  .score .n{font-size:22px;letter-spacing:2px;color:var(--warn)}
  .score .l{font-size:14px;color:var(--text-2)}
  ul.pts{padding-left:20px;margin:8px 0 14px}
  ul.pts li{margin:6px 0;color:var(--text-2)}
  textarea.note{width:100%;min-height:90px;border:1.5px solid var(--line);border-radius:var(--r);padding:10px 12px;font:inherit;font-size:15px;outline:0}
  textarea.note:focus{border-color:var(--accent)}

  @media (max-width:860px){
    .app{grid-template-columns:1fr}
    .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
    .steps{display:flex;flex-wrap:wrap;gap:4px}
    .steps li{padding:4px 8px}
    .steps .sub,.steps .txt{display:none}
    .main{padding:24px 18px 60px}
    .cases,.tools,.score{grid-template-columns:1fr}
    .card{padding:22px 18px}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <a class="back" href="/lesson.html?course=ai-intro&amp;lesson=l4">← 返回课程</a>
    <div class="course">AI入门 · 第4课 · 互动课</div>
    <h1>AI用得好不好，差在第二句话</h1>
    <span class="proto">练习中的 AI 回复为模拟</span>
    <div class="bar"><i id="bar"></i></div>
    <ul class="steps" id="steps"></ul>
    <button class="reset" id="reset">清空进度，重新开始</button>
  </aside>
  <main class="main"><div id="view"></div></main>
</div>

<script>
/* =========================================================
 * 第4课课程剧本（内容与播放逻辑分离）
 * ========================================================= */
const STEPS = [
  { id:'s0', label:'开场：两种结局' },
  { id:'s1', label:'第一次回答，只是反馈' },
  { id:'s2', label:'为什么第一次不够好' },
  { id:'s3', label:'走进案例', sub:'分支：小林 / 老陈 / 王总' },
  { id:'s4', label:'工具卡' },
  { id:'s5', label:'实操①：向内追问', sub:'让自己想清楚' },
  { id:'s6', label:'实操②：向外纠正', sub:'让 AI 改对' },
  { id:'s7', label:'教练点评' },
  { id:'s8', label:'反思：AI 是放大器' },
  { id:'s9', label:'小结与带走练习' },
];

/* 五种追问 + 两个动作：识别规则（关键词模拟） */
const ASK_TYPES = [
  { k:'原因', re:/为什么|依据|原因|凭什么|怎么得出/, starter:'为什么这么说？依据是什么？',
    reply:'这么说主要基于一般情况下的经验。不过坦白讲，这些依据是通用的，不一定适合你。如果你告诉我你的具体处境，我可以说明哪些依据对你成立、哪些不成立。' },
  { k:'可能', re:/别的|其他|还有没有|另外|替代|不同的(做法|方案|解释)/, starter:'还有没有别的做法或解释？',
    reply:'有的。除了上面说的思路，还可以反过来想：先不急着找方法，而是先找到一个最小的、这周就能验证的小目标。另一种做法是先找一个已经做成这件事的人，看他是怎么走过来的。' },
  { k:'遗漏', re:/忽略|遗漏|漏掉|风险|没考虑|盲点/, starter:'我可能忽略了什么？最大的风险在哪？',
    reply:'你可能忽略了两点：第一，你的时间和精力是有限的，上面五条不可能同时做；第二，最大的风险是一直在"准备"，却迟迟没有开始做一件具体的事。' },
  { k:'自己', re:/我的情况|结合我|对我|我适合|我这种|像我这样/, starter:'结合我的情况，这对我意味着什么？',
    reply:'要回答这个，我需要知道更多关于你的信息：你现在处在什么阶段？已经尝试过什么？最卡住你的是哪一点？你说得越具体，我的建议就越能对上你。' },
  { k:'行动', re:/第一步|怎么开始|具体(怎么|做)|计划|下一步|从哪/, starter:'如果要开始做，第一步具体做什么？',
    reply:'第一步可以很小：今天花 30 分钟，把你现在的情况和想达到的样子各写三条，然后对比找出差距最大的那一条。明天只针对这一条做一件事。' },
  { k:'反问', re:/问我|你问我|向我提问|帮我判断/, starter:'你问我几个问题，帮我判断一下。',
    reply:'好的，我先问你三个问题：\n1. 这件事你最希望在多长时间内看到变化？\n2. 过去类似的事，你做成过吗？是怎么做成的？\n3. 如果只能改变一件事，你会选什么？' },
  { k:'换角色', re:/扮演|角色|站在.{0,8}(角度|立场)|假如你是/, starter:'你扮演一位资深从业者，从他的角度看看。',
    reply:'好，换到一位资深从业者的角度：他不会先看你列了多少条计划，而会先问"你做过什么具体的事"。从他的视角看，一个做完的小成果，比十条计划更有说服力。' },
];
const MISUSE_RE = /再详细|详细一点|详细些|再来一版|专业一点|再写一遍|重新写|换个说法|再丰富/;

/* 实操②：预埋错误的 AI 回答 */
const PLANTED = {
  task:'给刚工作的年轻人讲讲：为什么要尽早存钱，以及什么是复利？',
  lines:[
    { t:'刚工作就开始存钱，最大的好处是让时间帮你。' },
    { t:'比如每天存 20 元，一年下来大约就是 2000 元。', err:'e1' },
    { t:'复利的意思是"利息也会产生利息"，也就是常说的"利滚利"。' },
    { t:'举个例子：1 万元按年化 10% 复利计算，2 年后就是 12000 元。', err:'e2' },
    { t:'所以只要坚持复利投资，任何理财产品都能保证收益，不会亏损。', err:'e3' },
    { t:'建议你从现在开始，每月固定存下收入的一部分。' },
  ],
  errors:{
    e1:{ re:/2000|7300|20\s*元|每天存/, name:'每天 20 元一年约 2000 元', fix:'每天 20 元，一年是 20 × 365 = 7300 元，不是 2000 元。' },
    e2:{ re:/12000|12100|两年|2\s*年|单利/, name:'1 万元 10% 复利 2 年是 12000 元', fix:'按复利计算，2 年后应为 10000 × 1.1 × 1.1 = 12100 元；12000 元是单利的算法。' },
    e3:{ re:/保证|亏损|不会亏|亏钱|风险|绝对|任何/, name:'复利能保证任何产品不亏损', fix:'复利只是一种计息方式，不能保证收益。理财产品都有风险，可能亏损，"保证不亏"的说法是错误的。' },
  },
  whyRe:/因为|应该是|实际|算下来|算一下|其实|而不是|才对|×|\*|乘/,
  checkRe:/重新|核对|核实|检查|依据|来源|区分|确认|再算/,
};

/* =========================================================
 * 状态（保存到账号的学习记录，换设备也能接着学）
 * ========================================================= */
/* 本页由 /api/courses/<课程>/lessons/<课>/interactive 提供，进度接口与之同级 */
const API = location.pathname.replace(/\/interactive\/?$/, '/progress');
const fresh = () => ({
  cur:'s0', done:[], choice:{}, cls:{}, cases:{}, caseView:null, reflect:'',
  inward:{ msgs:[], types:[], misuse:0, started:false, finished:false },
  outward:{ msgs:[], found:[], why:false, check:false, vague:0, finished:false },
});
let S = fresh();
let saveTimer = null, saving = Promise.resolve();
function put(body){
  saving = saving.then(() => fetch(API, { method:'PUT', credentials:'same-origin',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify({ mode:'interactive', ...body }) })
    .then(r => { if(!r.ok) throw r; saveErr(''); })
    .catch(r => saveErr(r && r.status === 401 ? '登录已过期，进度未保存，请返回课程重新登录' : '进度保存失败，请检查网络')));
  return saving;
}
/* 学习过程中状态频繁变化：合并 600ms 内的修改再保存 */
function save(){ clearTimeout(saveTimer); saveTimer = setTimeout(() => { saveTimer = null; put({ state:S }); }, 600); }
function saveErr(msg){
  let e = document.getElementById('saveerr');
  if(!msg){ e && e.remove(); return; }
  if(!e){ e = document.createElement('div'); e.id = 'saveerr'; e.className = 'saveerr'; e.setAttribute('role','alert'); document.body.appendChild(e); }
  e.textContent = msg;
}
/* 离开页面前把未保存的修改发出去 */
addEventListener('pagehide', () => { if(saveTimer){ clearTimeout(saveTimer); saveTimer = null;
  fetch(API, { method:'PUT', credentials:'same-origin', keepalive:true, headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ mode:'interactive', state:S }) }); } });
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = sel => document.querySelector(sel);
const idx = id => STEPS.findIndex(s => s.id === id);

function go(id){ S.cur = id; S.caseView = null; save(); render(); window.scrollTo({top:0,behavior:'smooth'}); }
function complete(id, next){ if(!S.done.includes(id)) S.done.push(id); go(next); }
function navBtns(nextLabel, nextId, enabled=true, extra=''){
  const i = idx(S.cur);
  return `<div class="nav">
    ${i>0 ? `<button class="btn" data-back>← 上一步</button>` : '<span></span>'}
    <span>${extra}<button class="btn pri" data-next="${nextId}" ${enabled?'':'disabled'}>${nextLabel} →</button></span>
  </div>`;
}
function bindNav(root){
  root.querySelector('[data-back]')?.addEventListener('click', () => go(STEPS[idx(S.cur)-1].id));
  root.querySelectorAll('[data-next]').forEach(b => b.addEventListener('click', () => complete(S.cur, b.dataset.next)));
}

/* =========================================================
 * 通用：单选题（每个选项有反馈；可设正确项，也可全部汇合）
 * ========================================================= */
function choiceBlock(key, q, opts){
  const picked = S.choice[key];
  const html = `<p class="big">${q}</p><div class="opts">${opts.map((o,i)=>{
      let cls = '';
      if(picked!==undefined){ if(o.right) cls='right'; else if(i===picked) cls = o.right===false ? 'wrong':'sel'; }
      return `<button class="opt ${cls}" data-c="${key}" data-i="${i}" ${picked!==undefined?'disabled':''}><span class="k">${'ABCD'[i]}</span>${o.t}</button>`;
    }).join('')}</div>
    ${picked!==undefined ? `<div class="fb ${opts[picked].right===false?'no':(opts[picked].right?'ok':'info')}">${opts[picked].fb}</div>` : ''}`;
  return { html, answered: picked!==undefined };
}
function bindChoice(root){

}

/* ---------- S5：实操①向内追问 ---------- */
s5(){
  const W = S.inward;
  const types = W.types;
  const ok = types.length >= 2;
  const goal = ASK_TYPES.map(t=>`<span class="${types.includes(t.k)?'on':''}">${types.includes(t.k)?'✓ ':''}${t.k}</span>`).join('');
  return { html:`<div class="card">
      <span class="tag">实操① · 向内追问</span>
      <h2>拿你自己的一个真问题，和 AI 多聊几句</h2>
      <p>${W.started
        ? '这个回答<strong>没有错</strong>，但对你有用吗？读完它，问问自己：<strong>它让我产生了什么新问题？</strong>然后用至少<strong>两种</strong>不同的追问，把对话往前推。'
        : '先输入一个你最近真的想问 AI 的问题（学习、工作、找方向都可以），AI 会先给你一个"标准答案"。'}</p>
      <div class="goal">${goal}</div>
      <div class="chat" id="chat">${renderChat(W.msgs)}</div>
      ${W.started ? `<div class="hints"><span class="muted">卡住了？点一下插入开头：</span>
        ${ASK_TYPES.map((t,i)=>`<button class="chip" data-hint="${i}">${t.k}</button>`).join('')}</div>` : ''}
      <div class="composer"><textarea id="inp" rows="2" placeholder="${W.started?'写下你的第二句…':'例如：我想转行做产品经理，应该怎么准备？'}"></textarea>
        <button class="btn pri" id="send">发送</button></div>
      <div class="sim" style="margin-top:6px">说明：这里的 AI 是练习用的模拟对话，按规则识别你的追问方式。</div>
      ${navBtns(ok?'完成，去下一个实操':'达成两种追问后继续', 's6', ok,
        W.started && !ok ? '<button class="link" data-next="s6" style="margin-right:14px">先跳过</button>' : '')}
    </div>`,
    bind(r){
      bindNav(r);
      r.querySelectorAll('[data-hint]').forEach(b=>b.addEventListener('click',()=>{ const t=$('#inp'); t.value=ASK_TYPES[b.dataset.hint].starter; t.focus(); }));
      bindComposer(r, text => {
        if(!W.started){
          W.started = true; W.q = text;
          W.msgs.push({r:'u',t:text});
          return { reply: genericAnswer(text), after(){ save(); render(); } };
        }
        const hit = ASK_TYPES.filter(t=>t.re.test(text));
        const mis = MISUSE_RE.test(text);
        const tags = [];
        hit.forEach(t=>{ tags.push({g:1,t:'✓ '+t.k}); if(!types.includes(t.k)) types.push(t.k); });
        if(mis){ W.misuse++; tags.push({g:0,t:'⚠ 误区：没带判断'}); }
        if(!hit.length && !mis) tags.push({g:0,t:'未识别为五种追问之一'});
        W.msgs.push({r:'u',t:text,tags});
        let reply;
        if(hit.length) reply = hit[0].reply;
        else if(mis) reply = genericAnswer(W.q||'这个问题').replace('一般可以从以下几个方面考虑','好的，我再展开一点，一般可以从以下几个方面考虑');
        else reply = '能再具体说说吗？比如你想知道原因、想看别的做法，还是想知道第一步怎么开始？';
        return { reply, after(){ save(); render(); } };
      }, W);
    } };
},

/* ---------- S6：实操②向外纠正 ---------- */
s6(){
  const O = S.outward;
  const found = O.found.length;
  const ok = found >= 2 && O.why && O.check;
  const head = { r:'a', planted:true };
  return { html:`<div class="card">
      <span class="tag">实操② · 向外纠正</span>
      <h2>这份回答里藏着几处错误，找出来，让 AI 改对</h2>
      <p>你让 AI <strong>"${PLANTED.task}"</strong>，它很快给了下面这段话。读一遍，用<strong>纠错三步</strong>告诉它哪里不对。</p>
      <div class="goal">
        <span class="${found>=2?'on':''}">已发现错误 ${found} / 3</span>
        <span class="${O.why?'on':''}">${O.why?'✓ ':''}说明为什么错</span>
        <span class="${O.check?'on':''}">${O.check?'✓ ':''}要求重新核对</span>
      </div>
      <div class="chat" id="chat">${renderChat([head, ...O.msgs])}</div>
      <div class="composer"><textarea id="inp" rows="2" placeholder="例如：你第二句说……我认为不对，因为……请重新核对这一段。"></textarea>
        <button class="btn pri" id="send">发送</button></div>
      <div class="sim" style="margin-top:6px">说明：这里的 AI 是练习用的模拟对话，按规则识别你是否指出了错误。</div>
      ${navBtns(ok?'完成，去看点评':'至少找出 2 处并完成三步后继续', 's7', ok,
        O.msgs.length && !ok ? '<button class="link" data-next="s7" style="margin-right:14px">先跳过，去看点评</button>' : '')}
    </div>`,
    bind(r){
      bindNav(r);
      bindComposer(r, text => {
        const newly = Object.entries(PLANTED.errors).filter(([k,e])=>e.re.test(text) && !O.found.includes(k));
        const any = Object.values(PLANTED.errors).some(e=>e.re.test(text));
        const why = PLANTED.whyRe.test(text), chk = PLANTED.checkRe.test(text);
        const tags = [];
        newly.forEach(([k])=>{ O.found.push(k); });
        if(any) tags.push({g:1,t:'✓ 指出了位置'}); else { O.vague++; tags.push({g:0,t:'⚠ 没指出具体哪一句'}); }
        if(why){ O.why=true; tags.push({g:1,t:'✓ 说明了为什么'}); }
        if(chk){ O.check=true; tags.push({g:1,t:'✓ 要求核对'}); }
        O.msgs.push({r:'u',t:text,tags});
        let reply;
        if(newly.length){
          reply = '你说得对，我重新核对了一下：\n' + newly.map(([,e])=>'· '+e.fix).join('\n')
            + (chk ? '\n\n以上计算是事实，可以自己验算；理财风险相关的说法建议以正规金融机构的说明为准。' : '');
        } else if(any){
          reply = '这一处你之前已经指出过了，我已经更正。还有其他问题吗？';
        } else {
          reply = '抱歉，我不太确定你指的是哪一部分。能具体说一下是哪一句、哪个数字有问题吗？';
        }
        return { reply, after(){ save(); render(); } };
      }, O);
    } };
},

/* ---------- S7：教练点评（分支：通过 / 回炉） ---------- */
s7(){
  const W=S.inward, O=S.outward;
  const deep = Math.min(3, W.types.length);                         // 深化：用了几种追问
  const judge = Math.min(3, O.found.length);                       // 判断：找出几处错误
  const feed = (O.why?1:0) + (O.check?1:0) + (W.misuse===0 && O.vague===0 && (W.msgs.length||O.msgs.length) ? 1:0); // 反馈：说得清楚
  const pass = deep>=2 && judge>=2 && feed>=2;
  const star = n => '★'.repeat(n)+'☆'.repeat(3-n);
  const pts = [];
  if(W.types.length) pts.push(`你用了 <strong>${W.types.join('、')}</strong> ${W.types.length} 种追问。${W.types.length>=3?'角度很丰富。':W.types.length===2?'不错，下次试试"问遗漏"或"让 AI 反过来问你"。':'只用了一种，对话还没真正推开。'}`);
  else pts.push('实操①还没有追问，二次对话最关键的"第二句"还没出现。');
  if(W.misuse) pts.push(`有 <strong>${W.misuse} 次</strong>用了"再详细一点 / 再来一版"这类说法，这句话背后没有你的判断，只是在碰运气。`);
  const missed = Object.entries(PLANTED.errors).filter(([k])=>!O.found.includes(k)).map(([,e])=>e.name);
  pts.push(`实操②找出了 <strong>${O.found.length} / 3</strong> 处错误。${missed.length?'没发现的是：'+missed.map(m=>'「'+m+'」').join('、')+'。':'全部找到了。'}`);
  if(missed.some(m=>m.includes('保证'))) pts.push('"保证不亏损"这类<strong>绝对化</strong>的说法最需要警惕，它不是算错，而是常识性的误导。');
  if(!O.why) pts.push('纠正时没有说明<strong>为什么错</strong>，AI 不知道正确的依据，改出来的也可能还是错的。');
  if(!O.check) pts.push('没有要求 AI <strong>重新核对或说明依据</strong>，这一步能让它区分事实和推测。');
  if(O.vague) pts.push(`有 ${O.vague} 次只说了"不对"，没指出具体哪一句，AI 很难改到点上。`);
  return { html:`<div class="card">
      <span class="tag">教练点评</span>
      <h2>${pass?'通过！你的"第二句"已经带着判断了':'还差一点，看看卡在哪一步'}</h2>
      <p>二次对话里，真正起作用的是人在两句话之间做的三件事：</p>
      <div class="score">
        <div><div class="n">${star(judge)}</div><div class="l">判断<br><span class="muted">对不对？是不是我要的？</span></div></div>
        <div><div class="n">${star(deep)}</div><div class="l">深化<br><span class="muted">它让我想到了什么新问题？</span></div></div>
        <div><div class="n">${star(feed)}</div><div class="l">反馈<br><span class="muted">把判断清楚地告诉 AI</span></div></div>
      </div>
      <h3>具体点评</h3>
      <ul class="pts">${pts.map(p=>`<li>${p}</li>`).join('')}</ul>
      <p class="sim">说明：评分按规则根据你在两个实操里的表现给出。</p>
      ${pass ? navBtns('继续', 's8') : `<div class="nav"><button class="btn" data-back>← 上一步</button><span>
          ${deep<2||feed<2?'<button class="btn" data-redo="s5" style="margin-right:8px">回到实操①</button>':''}
          ${judge<2||feed<2?'<button class="btn" data-redo="s6" style="margin-right:8px">回到实操②</button>':''}
          <button class="link" data-next="s8">仍然继续</button></span></div>`}
    </div>`,
    bind(r){ bindNav(r); r.querySelectorAll('[data-redo]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.redo))); } };
},

/* ---------- S9：小结 ---------- */
s9(){
  const all = S.done.includes('s9');
  return { html:`<div class="card">

/* =========================================================
 * 案例分支：对话回放 + 停顿提问
 * ========================================================= */
function replay(key, rounds, ending){
  // rounds: [{msgs:[...], ask:{q, opts}}]，回答完一个 ask 才显示下一轮
  let html = '', allAnswered = true;
  for(let i=0;i<rounds.length;i++){
    const r = rounds[i];
    html += `<div class="chat">${renderChat(r.msgs)}</div>`;
    if(r.ask){
      const c = choiceBlock(`${key}-${i}`, r.ask.q, r.ask.opts);
      html += `<div style="margin:6px 0 18px">${c.html}</div>`;
      if(!c.answered){ allAnswered = false; break; }
    }
  }
  if(allAnswered) html += `<div class="fb ok"><b>${ending.title}</b>${ending.body}</div>`;
  return { html, allAnswered };
}
function caseShell(key, c, body){
  const done = body.allAnswered;
  if(done && !S.cases[key]){ S.cases[key]=1; save(); }
  return { html:`<div class="card">
      <span class="tag">案例 · ${c.who}（${c.dir}）</span>
      <h2>${c.title}</h2>
      <p>${c.intro}</p>
      ${body.html}
      <div class="nav"><button class="btn" data-caseback>← 返回案例选择</button>
        ${done?'<button class="btn pri" data-caseback>完成，返回 →</button>':''}</div>
    </div>`,
    bind(r){ bindChoice(r); r.querySelectorAll('[data-caseback]').forEach(b=>b.addEventListener('click',()=>{ S.caseView=null; save(); render(); window.scrollTo({top:0}); })); } };
}

/* =========================================================
 * 对话渲染与模拟回复
 * ========================================================= */
function renderChat(msgs){
  return msgs.map(m=>{
    if(m.planted) return `<div class="msg a"><span class="who">AI</span>${PLANTED.lines.map(l=>{
      const hit = l.err && S.outward.found.includes(l.err);
      return `<span class="line ${hit?'bad':''}">${esc(l.t)}</span>`; }).join('')}</div>`;
    const who = m.r==='u' ? (m.who||'你') : 'AI';
    let h = `<div class="msg ${m.r}"><span class="who">${esc(who)}</span>${esc(m.t)}</div>`;
    if(m.tags) h += `<div class="msgtag">${m.tags.map(t=>`<span class="${t.g?'g':'w'}">${esc(t.t)}</span>`).join('')}</div>`;
    return h;
  }).join('');
}
function genericAnswer(q){
  return `关于「${q}」，一般可以从以下几个方面考虑：\n1. 明确目标：想清楚自己真正想要什么。\n2. 收集信息：多了解相关领域的情况。\n3. 制定计划：把大目标拆成小步骤。\n4. 执行与复盘：边做边调整。\n5. 寻求帮助：向有经验的人请教。\n这些方法适用于大多数情况，你可以根据实际情况灵活选择。`;
}
function bindComposer(root, handler, store){
  const inp = root.querySelector('#inp'), btn = root.querySelector('#send');
  const send = () => {
    const text = inp.value.trim(); if(!text) return;
    const { reply, after } = handler(text);
    inp.value=''; btn.disabled = true;
    const chat = root.querySelector('#chat');
    chat.innerHTML = renderChat(S.cur==='s6' ? [{r:'a',planted:true}, ...store.msgs] : store.msgs) + '<div class="typing">AI 正在输入…</div>';
    setTimeout(()=>{ store.msgs.push({r:'a',t:reply}); after(); setTimeout(()=>$('#chat')?.lastElementChild?.scrollIntoView({behavior:'smooth',block:'nearest'}),50); }, 700);
  };
  btn.addEventListener('click', send);
  inp.addEventListener('keydown', e => { if(e.key==='Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); send(); } });
}

/* =========================================================
 * 渲染
 * ========================================================= */
function render(){
  const ci = idx(S.cur);
  const reach = Math.max(ci, ...S.done.map(idx).map(i=>i+1));
  $('#steps').innerHTML = STEPS.map((s,i)=>`<li class="${S.done.includes(s.id)?'done':''} ${s.id===S.cur?'cur':''} ${i<=reach?'can':''}" data-go="${i<=reach?s.id:''}">
      <span class="dot">${S.done.includes(s.id)?'✓':i}</span><span class="txt">${s.label}${s.sub?`<span class="sub">${s.sub}</span>`:''}</span></li>`).join('');
  $('#steps').querySelectorAll('[data-go]').forEach(li=>li.dataset.go && li.addEventListener('click',()=>go(li.dataset.go)));
  $('#bar').style.width = (S.done.length/STEPS.length*100)+'%';
  const v = VIEWS[S.cur]();
  const view = $('#view'); view.innerHTML = v.html; v.bind && v.bind(view);
}

});

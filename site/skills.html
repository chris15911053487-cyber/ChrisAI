<style>
body{overflow:auto;display:block}
.bar{position:sticky;top:0}
.wrap{width:min(1240px,calc(100% - 40px));margin:0 auto;padding:28px 0 64px;display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}
.card{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-lg);padding:16px}
aside.card{position:sticky;top:84px;max-height:calc(100vh - 108px);overflow-y:auto;background:var(--bg-2)}
main.card{padding:24px;min-width:0}
.list-head{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.group{font:500 11px/1 var(--mono);color:var(--text-3);letter-spacing:.06em;text-transform:uppercase;margin:18px 6px 8px}
.sk{display:block;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:10px;padding:10px 12px;cursor:pointer;transition:background .15s,border-color .15s,box-shadow .15s}
.sk:hover{background:rgba(10,10,10,.04)}
.sk.active{background:var(--surface);border-color:var(--line);box-shadow:var(--sh-1)}
.sk .n{font:500 13px/1.3 var(--mono);display:flex;align-items:center;justify-content:space-between;gap:8px}
.sk .ds{font-size:12.5px;color:var(--text-2);margin-top:5px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{color:var(--text-3);font-size:12.5px;padding:4px 12px;line-height:1.6}
.search{display:flex;align-items:center;gap:8px;height:36px;margin-top:12px;padding:0 10px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface);color:var(--text-3);transition:border-color var(--dur),box-shadow var(--dur)}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search input{flex:1;min-width:0;border:none;background:none;outline:none;font:13.5px/1 var(--sans);color:var(--text)}
.search input::placeholder{color:var(--text-3)}
.search kbd{font:11px/1 var(--mono);color:var(--text-3);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:2px 5px;background:var(--bg)}
.search:focus-within kbd{display:none}
.scope{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;margin-top:8px;padding:3px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}
.scope button{height:28px;border:none;border-radius:6px;background:none;font-size:12px;color:var(--text-2);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;transition:background var(--dur),color var(--dur)}
.scope button:hover{color:var(--text)}
.scope button small{font:10.5px/1 var(--mono);color:var(--text-3)}
.scope button.on{background:var(--surface);color:var(--text);font-weight:500;box-shadow:var(--sh-1)}
.sk mark{background:rgba(250,204,21,.35);color:inherit;border-radius:3px;padding:0 1px}
.sk-none{padding:18px 12px;text-align:center;color:var(--text-3);font-size:12.5px}
.sk-none button{margin-top:8px;border:none;background:none;color:var(--accent);font-size:12.5px;cursor:pointer}
.detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;padding-bottom:18px;margin-bottom:18px;border-bottom:1px solid var(--line)}
.detail-head h2{margin:0;font:600 20px/1.3 var(--mono);letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.detail-head p{margin:8px 0 0;color:var(--text-2);font-size:14px;line-height:1.65;max-width:620px}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.ed{display:grid;grid-template-columns:210px 1fr;gap:16px;min-height:420px}
.files-nav{border-right:1px solid var(--line);padding-right:12px;display:flex;flex-direction:column;gap:2px}
.files-title{font:500 11px/1 var(--mono);color:var(--text-3);letter-spacing:.06em;text-transform:uppercase;padding:2px 4px 8px}
/* 树形结构 */
.tree-root{font:500 12px/1 var(--mono);color:var(--text-2);padding:6px 4px 8px;word-break:break-all;display:flex;align-items:center;gap:6px}
.tree-root .i{width:14px;height:14px;color:var(--text-3)}
.tree-dir{display:flex;align-items:center;gap:0;font:11.5px/1 var(--mono);color:var(--text-3);padding:9px 9px 4px}
.tree-dir .tree-guide{color:var(--line-2)}
.tree-dir .tree-dname{color:var(--text-2);word-break:break-all}
.tree-guide{flex:none;white-space:pre;font:12.5px/1.3 var(--mono);color:var(--line-2);user-select:none;margin-right:2px}
.fitem{display:flex;align-items:center;gap:10px;text-align:left;background:none;border:1px solid transparent;border-radius:9px;padding:8px 9px;cursor:pointer;transition:background .15s,border-color .15s}
.fitem:hover{background:rgba(10,10,10,.04)}
.fitem.active{background:var(--surface);border-color:var(--line);box-shadow:var(--sh-1)}
.fkind{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font:700 9.5px/1 var(--mono);letter-spacing:.02em;border:1px solid var(--line)}
.k-skill{background:var(--text);color:#fff;border-color:var(--text)}
.k-py{background:#EFF6FF;color:#1D4ED8;border-color:#DBEAFE}
.k-md{background:#F5F3FF;color:#6D28D9;border-color:#EDE9FE}
.k-json{background:#FEFCE8;color:#A16207;border-color:#FEF08A}
.k-yaml{background:#ECFEFF;color:#0E7490;border-color:#CFF9FE}
.k-data{background:#ECFDF5;color:#047857;border-color:#D1FAE5}
.k-web{background:#FFF7ED;color:#C2410C;border-color:#FFEDD5}
.k-img{background:#FDF2F8;color:#BE185D;border-color:#FCE7F3}
.k-txt,.k-bin{background:var(--bg-2);color:var(--text-2)}
.fmeta{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.fname{font:500 13px/1.3 var(--sans);color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fitem.active .fname{color:var(--text)}
.fsub{font:10.5px/1 var(--mono);color:var(--text-3)}
.fdot{flex:none;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.editor .path{align-items:center}
.path-name{font:12px/1 var(--mono);color:var(--text-2)}
.path-right{display:flex;align-items:center;gap:8px}
.vseg{display:flex;padding:3px;gap:2px;border:1px solid var(--line-2);border-radius:9px;background:var(--bg-2)}
.vseg button{height:26px;padding:0 12px;border:none;border-radius:6px;background:none;font-size:12.5px;color:var(--text-2);cursor:pointer;transition:background var(--dur),color var(--dur)}
.vseg button:hover{color:var(--text)}
.vseg button.on{background:var(--surface);color:var(--text);font-weight:500;box-shadow:var(--sh-1)}
/* 预览面板 */
.preview-pane{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.frontmatter{display:flex;flex-direction:column;gap:0;background:var(--bg-2);border-bottom:1px solid var(--line);padding:6px 4px}
.fm-row{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:8px 16px}
.fm-row+.fm-row{border-top:1px solid var(--line)}
.fm-k{font:500 12px/1.5 var(--mono);color:var(--text-3);text-transform:uppercase;letter-spacing:.04em}
.fm-v{font-size:13.5px;line-height:1.6;color:var(--text);word-break:break-word}
.preview-pane .md{padding:20px 22px;font-size:14.5px}
.preview-pane .md>:first-child{margin-top:0}
/* 只读代码视图 */
.codeview{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.code-bar{display:flex;align-items:center;justify-content:space-between;height:38px;padding:0 10px 0 14px;border-bottom:1px solid var(--line);background:var(--bg-2)}
.code-lang{font:500 11px/1 var(--mono);color:var(--text-3);letter-spacing:.06em}
.code-copy{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border:1px solid var(--line-2);border-radius:7px;background:var(--surface);font-size:12px;color:var(--text-2);cursor:pointer}
.code-copy:hover{border-color:var(--text-3);color:var(--text)}
.code-copy .i{width:13px;height:13px}
.code-scroll{display:flex;max-height:560px;overflow:auto;background:var(--bg)}
.code-gutter{flex:none;padding:14px 12px;text-align:right;font:12.5px/1.7 var(--mono);color:var(--text-3);background:var(--bg-2);border-right:1px solid var(--line);white-space:pre;user-select:none}
.code-body{margin:0;padding:14px 16px;overflow:visible;background:none;border:none;border-radius:0}
.code-body code{font:12.5px/1.7 var(--mono);color:var(--text);white-space:pre}
@media(max-width:900px){.fm-row{grid-template-columns:88px 1fr}}
.editor{display:flex;flex-direction:column;gap:8px;min-width:0}
.editor .path{font:12px/1 var(--mono);color:var(--text-3);display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:28px}
.editor textarea{width:100%;min-height:480px;flex:1;resize:vertical;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px 16px;font:13px/1.65 var(--mono);color:var(--text);tab-size:4;white-space:pre;overflow:auto;max-height:none}
.editor textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.editor textarea[readonly]{color:var(--text-2)}
.bin{color:var(--text-2);font-size:13px;padding:20px;border:1px dashed var(--line-2);border-radius:10px}
.bin a{color:var(--accent)!important}
.welcome-card{max-width:680px;padding:12px 8px}
.welcome-card .eyebrow{display:block;font:500 11.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);margin-bottom:12px}
.welcome-card h2{margin:0 0 12px;font-size:28px;font-weight:600;letter-spacing:-.03em}
.welcome-card p,.welcome-card li{color:var(--text-2);font-size:14.5px;line-height:1.8}
.welcome-card ul{padding-left:1.2em}
.welcome-card li::marker{color:var(--text-3)}
.welcome-card b{color:var(--text);font-weight:600}
.welcome-card code{font-family:var(--mono);background:var(--bg-2);border:1px solid var(--line);padding:.1em .35em;border-radius:5px;font-size:.88em}
@media(max-width:900px){.wrap{grid-template-columns:1fr}aside.card{position:static;max-height:none}.ed{grid-template-columns:1fr}.files-nav{border-right:none;border-bottom:1px solid var(--line);padding:0 0 10px}}
</style>

<body data-nav="skills">

<header class="bar">
  <div class="left">
    <a class="logo" href="index.html" aria-label="返回首页">CL</a>
    <h1>技能<small>Skills</small></h1>
  </div>
  <div class="actions">
    <a class="iconbtn" href="agent.html"><i data-i="message"></i>返回对话</a>
  </div>
</header>

<div class="wrap">
  <aside class="card">
    <div class="list-head">
      <button class="iconbtn primary" id="newSkillBtn"><i data-i="plus"></i>新建技能</button>
      <button class="iconbtn" id="importBtn"><i data-i="upload"></i>导入 zip</button>
      <input type="file" id="importInput" accept=".zip,application/zip" hidden>
    </div>
    <label class="search">
      <i data-i="search"></i>
      <input type="search" id="skillSearch" placeholder="搜索技能" aria-label="搜索技能">
      <kbd>/</kbd>
    </label>
    <div class="scope" id="scopeSeg" role="group" aria-label="技能范围"></div>
    <div id="skillList" aria-live="polite"></div>
  </aside>

  <main class="card" id="detail">
    <div class="welcome-card">
      <span class="eyebrow">Skills</span>
      <h2>什么是技能？</h2>
      <p>技能（Skill）是一个包含 <code>SKILL.md</code> 说明和可选 Python 脚本的文件夹。对话时，AI 会根据技能的描述自动判断何时使用它，按说明调用脚本，在隔离沙箱中生成文档、表格等结果。</p>
      <ul>
        <li><b>内置 / 公共技能</b>：所有访客可用，只读；可以"复制"成自己的技能再修改。</li>
        <li><b>我的技能</b>：只有你自己可见。可以在这里编辑，也可以在对话中说"帮我创建一个 xx 技能"。</li>
        <li>技能格式兼容 Anthropic Agent Skills，可导入 / 导出 zip。</li>
      </ul>
      <p>从左侧选择一个技能查看详情。</p>
    </div>
  </main>
</div>

<dialog id="dlg">
  <form method="dialog" id="dlgForm">
    <h3 id="dlgTitle"></h3>
    <div id="dlgFields"></div>
    <div class="err" id="dlgErr"></div>
    <div class="row">
      <button class="iconbtn" value="cancel" formnovalidate>取消</button>
      <button class="iconbtn primary" value="ok" id="dlgOk">确定</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="vendor/marked-14.1.4.umd.js"></script>
<script src="vendor/purify-3.2.3.min.js"></script>
<script src="icons.js?v=20261001b"></script>
<script src="auth.js?v=20261001b"></script>
<script src="sidebar.js?v=20261001b"></script>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const NAME_RE = /^[a-z0-9][a-z0-9-]{0,63}$/;
  const SCOPE = {builtin: '内置', public: '公共', user: '我的'};
  const TEXT_EXT = /\.(md|txt|py|json|ya?ml|csv|html|css|js|xml|sql|toml|ini|cfg)$/i;

  let skills = [], current = null, fq = '', fscope = '';
  let viewMode = 'preview'; // preview | source

  marked.setOptions({gfm: true, breaks: true});
  DOMPurify.addHook('afterSanitizeAttributes', node => { if (node.tagName === 'A') { node.setAttribute('target', '_blank'); node.setAttribute('rel', 'noopener noreferrer'); } });
  const renderMd = t => DOMPurify.sanitize(marked.parse(t || ''), {FORBID_TAGS: ['style','form','input','img'], FORBID_ATTR: ['style','onerror','onload']}); // current: {meta, files:{path:{content,orig,text,size}}, active, added:Set, deleted:Set}

  let tt;
  function toast(msg, err) {
    const t = $('toast'); t.textContent = msg; t.classList.toggle('err', !!err); t.classList.add('show');
    clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 3200);
  }
  async function api(path, opts = {}) {
    const r = await fetch(path, {credentials: 'same-origin', ...opts});
    let d = null; try { d = await r.json(); } catch {}
    if (!r.ok) {
      let msg = d && d.detail;
      if (Array.isArray(msg)) msg = msg.map(x => x.msg).join('；');
      throw new Error(msg || ('请求失败（' + r.status + '）'));
    }
    return d;
  }
  const jpost = (path, body, method = 'POST') => api(path, {method, headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});

  /* ---------- 通用对话框 ---------- */
  function ask(title, fields, onOk) {
    const dlg = $('dlg'), box = $('dlgFields');
    $('dlgTitle').textContent = title; $('dlgErr').textContent = ''; box.replaceChildren();
    const inputs = {};
    for (const f of fields) {
      const lab = el('label', '', f.label); const id = 'f_' + f.key; lab.htmlFor = id;
      const inp = el(f.multiline ? 'textarea' : 'input'); inp.id = id; inp.value = f.value || ''; if (f.placeholder) inp.placeholder = f.placeholder;
      if (f.multiline) inp.rows = 3;
      inputs[f.key] = inp; box.append(lab, inp);
    }
    const form = $('dlgForm');
    form.onsubmit = async e => {
      if (e.submitter && e.submitter.value === 'cancel') return;
      e.preventDefault();
      const vals = Object.fromEntries(Object.entries(inputs).map(([k, v]) => [k, v.value.trim()]));
      $('dlgOk').disabled = true;
      try { await onOk(vals); dlg.close(); }
      catch (err) { $('dlgErr').textContent = err.message; }
      finally { $('dlgOk').disabled = false; }
    };
    dlg.showModal();
    const first = Object.values(inputs)[0]; if (first) first.focus();
  }

  /* ---------- 列表 ---------- */
  async function loadList(select) {
    try { skills = (await api('/api/skills')).skills; } catch (e) { toast(e.message, true); return; }
    renderList();
    if (select) openSkill(select);
  }

  // 高亮匹配词（纯 DOM）
  function hl(text, q) {
    const f = document.createDocumentFragment();
    if (!q) { f.append(text); return f; }
    const low = text.toLowerCase(); let i = 0, j;
    while ((j = low.indexOf(q, i)) >= 0) { if (j > i) f.append(text.slice(i, j)); f.append(el('mark', '', text.slice(j, j + q.length))); i = j + q.length; }
    f.append(text.slice(i)); return f;
  }

  function renderScope() {
    const seg = $('scopeSeg'); seg.replaceChildren();
    const n = k => skills.filter(s => !k || s.scope === k).length;
    for (const [k, label] of [['', '全部'], ['user', '我的'], ['builtin', '内置'], ['public', '公共']]) {
      const b = el('button', fscope === k ? 'on' : '', label); b.type = 'button';
      b.setAttribute('aria-pressed', fscope === k); b.append(el('small', '', String(n(k))));
      b.addEventListener('click', () => { fscope = k; renderList(); });
      seg.append(b);
    }
  }

  function renderList() {
    renderScope();
    const q = fq.toLowerCase();
    const match = s => (!fscope || s.scope === fscope) && (!q || s.name.toLowerCase().includes(q) || (s.description || '').toLowerCase().includes(q));
    const box = $('skillList'); box.replaceChildren();
    const groups = [['我的技能', s => s.scope === 'user'], ['内置 / 公共技能', s => s.scope !== 'user']];
    let shown = 0;
    for (const [title, fn] of groups) {
      const items = skills.filter(fn).filter(match);
      // 筛选中：空分组直接隐藏（"我的"范围下仍保留分组，以便显示创建提示）
      if ((q || fscope) && !items.length && !(fscope === 'user' && !q && title === '我的技能')) continue;
      box.append(el('div', 'group', title));
      if (!items.length) box.append(el('div', 'empty', title === '我的技能' ? '还没有，点击"新建技能"或在对话中让 AI 帮你创建' : '无'));
      for (const s of items) {
        shown++;
        const b = el('button', 'sk'); b.dataset.name = s.name;
        const n = el('div', 'n'); n.append(el('span', '', ''), el('span', 'badge ' + s.scope, SCOPE[s.scope]));
        n.firstChild.append(hl(s.name, q));
        const ds = el('div', 'ds'); ds.append(hl(s.description || '', q));
        b.append(n, ds);
        b.addEventListener('click', () => openSkill(s.name));
        box.append(b);
      }
    }
    if (!shown && (q || fscope) && skills.length) {
      const e = el('div', 'sk-none', '没有匹配的技能');
      const c = el('button', '', '清除筛选'); c.type = 'button';
      c.addEventListener('click', () => { fq = ''; fscope = ''; $('skillSearch').value = ''; renderList(); });
      e.append(el('br'), c); box.append(e);
    }
    markActive();
  }

  let st;
  $('skillSearch').addEventListener('input', e => { clearTimeout(st); st = setTimeout(() => { fq = e.target.value.trim(); renderList(); }, 100); });
  $('skillSearch').addEventListener('keydown', e => { if (e.key === 'Escape') { e.target.value = ''; fq = ''; renderList(); } });
  addEventListener('keydown', e => {
    if (e.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) && !$('dlg').open) { e.preventDefault(); $('skillSearch').focus(); }
  });
  function markActive() {
    document.querySelectorAll('.sk').forEach(b => b.classList.toggle('active', !!current && b.dataset.name === current.meta.name));
  }

  /* ---------- 详情 / 编辑 ---------- */
  function dirty() {
    if (!current) return false;
    return current.added.size || current.deleted.size || Object.values(current.files).some(f => f.text && f.content !== f.orig);
  }
  addEventListener('beforeunload', e => { if (dirty()) { e.preventDefault(); e.returnValue = ''; } });

  async function openSkill(name) {
    if (dirty() && !confirm('有未保存的修改，确定放弃？')) return;
    let meta;
    try { meta = await api('/api/skills/' + encodeURIComponent(name)); } catch (e) { toast(e.message, true); return; }
    const files = {};
    for (const f of meta.files) files[f.path] = {size: f.size, text: TEXT_EXT.test(f.path), content: null, orig: null};
    files['SKILL.md'] = {size: meta.skill_md.length, text: true, content: meta.skill_md, orig: meta.skill_md};
    current = {meta, files, active: 'SKILL.md', added: new Set(), deleted: new Set()};
    history.replaceState(null, '', '#' + name);
    renderDetail();
    markActive();
  }

  async function ensureContent(path) {
    const f = current.files[path];
    if (!f || f.content != null || !f.text) return;
    const r = await api('/api/skills/' + encodeURIComponent(current.meta.name) + '/files/' + path.split('/').map(encodeURIComponent).join('/'));
    f.text = r.text; f.content = f.orig = r.text ? r.content : null;
  }

  function renderDetail() {
    const {meta} = current, editable = meta.editable;
    const d = $('detail'); d.replaceChildren();

    const head = el('div', 'detail-head');
    const left = el('div');
    const h = el('h2', '', meta.name); h.append(el('span', 'badge ' + meta.scope, SCOPE[meta.scope]));
    left.append(h, el('p', '', meta.description));
    const btns = el('div', 'btns');
    const btn = (label, fn, cls, ic) => { const b = el('button', 'iconbtn' + (cls ? ' ' + cls : '')); if (ic) b.innerHTML = icon(ic); b.append(label); b.addEventListener('click', fn); btns.append(b); return b; };
    btn('在对话中使用', () => { location.href = 'agent.html?q=' + encodeURIComponent('请使用技能 ' + meta.name + ' 帮我：'); }, '', 'message');
    if (editable) {
      btn('保存', save, 'primary', 'save');
      btn('新文件', addFile, '', 'plus');
    }
    btn('导出', () => { location.href = '/api/skills/' + encodeURIComponent(meta.name) + '/export'; }, '', 'download');
    btn('复制为我的技能', fork, '', 'fork');
    if (editable) btn('删除', removeSkill, 'danger', 'trash');
    head.append(left, btns);

    const ed = el('div', 'ed');
    const nav = el('div', 'files-nav');
    const paths = Object.keys(current.files).filter(p => !current.deleted.has(p));
    // 以技能名为根，显示文件树
    const root = el('div', 'tree-root'); root.innerHTML = icon('folder'); root.append(meta.name + '/');
    nav.append(root);
    renderTree(nav, buildTree(paths));

    const editor = el('div', 'editor');
    const f = current.files[current.active];
    const isText = f && f.text && f.content != null;
    // Markdown 文件默认可预览；其余文本文件也提供预览（代码块）
    const canPreview = isText;
    if (canPreview && viewMode !== 'preview' && viewMode !== 'source') viewMode = 'preview';

    const pathRow = el('div', 'path');
    pathRow.append(el('span', 'path-name', current.active));
    const rowRight = el('div', 'path-right');
    if (canPreview) {
      const seg = el('div', 'vseg'); seg.setAttribute('role', 'group'); seg.setAttribute('aria-label', '查看方式');
      for (const [m, label] of [['preview', '预览'], ['source', editable ? '编辑' : '源码']]) {
        const b = el('button', viewMode === m ? 'on' : ''); b.type = 'button'; b.textContent = label;
        b.setAttribute('aria-pressed', viewMode === m);
        b.addEventListener('click', () => { viewMode = m; renderDetail(); });
        seg.append(b);
      }
      rowRight.append(seg);
    }
    if (editable && current.active !== 'SKILL.md') {
      const del = el('button', 'iconbtn danger', '删除此文件');
      del.addEventListener('click', () => {
        if (!confirm('从技能中删除 ' + current.active + '？（保存后生效）')) return;
        if (current.added.has(current.active)) { current.added.delete(current.active); delete current.files[current.active]; }
        else current.deleted.add(current.active);
        current.active = 'SKILL.md'; renderDetail();
      });
      rowRight.append(del);
    }
    pathRow.append(rowRight);
    editor.append(pathRow);

    if (isText && viewMode === 'preview') {
      const ext = current.active.slice(current.active.lastIndexOf('.') + 1).toLowerCase();
      const view = el('div', 'preview-pane');
      if (ext === 'md') {
        const {body, front} = splitFrontmatter(f.content);
        if (front) {
          const fm = el('div', 'frontmatter');
          for (const [k, v] of front) { const row = el('div', 'fm-row'); row.append(el('span', 'fm-k', k), el('span', 'fm-v', v)); fm.append(row); }
          view.append(fm);
        }
        const md = el('div', 'md'); md.innerHTML = renderMd(body); view.append(md);
      } else {
        view.append(codeBlock(f.content, ext));
      }
      editor.append(view);
    } else if (isText) {
      const ta = el('textarea'); ta.value = f.content; ta.readOnly = !editable; ta.spellcheck = false;
      ta.setAttribute('aria-label', current.active);
      ta.addEventListener('input', () => {
        const was = f.content !== f.orig; f.content = ta.value;
        if (was !== (f.content !== f.orig)) { const pos = ta.selectionStart; renderDetail(); const t2 = document.querySelector('.editor textarea'); t2.focus(); t2.selectionStart = t2.selectionEnd = pos; }
      });
      ta.addEventListener('keydown', e => {
        if (e.key === 'Tab' && !ta.readOnly) { e.preventDefault(); document.execCommand('insertText', false, '    '); }
        if ((e.ctrlKey || e.metaKey) && e.key === 's' && editable) { e.preventDefault(); save(); }
      });
      editor.append(ta);
    } else if (f && !f.text) {
      const b = el('div', 'bin', '二进制文件（' + fmt(f.size) + '），不支持在线编辑。 ');
      const a = el('a', '', '下载'); 
      a.href = '/api/skills/' + encodeURIComponent(meta.name) + '/files/' + current.active.split('/').map(encodeURIComponent).join('/') + '?raw=1';
      b.append(a); editor.append(b);
    } else {
      editor.append(el('div', 'bin', '加载中…'));
      ensureContent(current.active).then(renderDetail).catch(e => toast(e.message, true));
    }
    if (!editable) editor.append(el('div', 'path', '只读：内置/公共技能不可直接修改，可"复制为我的技能"后编辑。'));

    ed.append(nav, editor);
    d.append(head, ed);
  }

  const fmt = n => n < 1024 ? n + ' B' : (n / 1024).toFixed(1) + ' KB';

  // 从文件路径列表构建嵌套树：{name, path?, dirs:Map, files:[]}
  function buildTree(paths) {
    const root = {dirs: new Map(), files: []};
    for (const p of paths) {
      const parts = p.split('/');
      let node = root;
      for (let i = 0; i < parts.length - 1; i++) {
        const seg = parts[i];
        if (!node.dirs.has(seg)) node.dirs.set(seg, {name: seg, dirs: new Map(), files: []});
        node = node.dirs.get(seg);
      }
      node.files.push({name: parts[parts.length - 1], path: p});
    }
    return root;
  }

  // 递归渲染树形：目录在前，文件在后；SKILL.md 置于根层首位
  function renderTree(nav, node, prefix = '', isRoot = true) {
    const dirs = [...node.dirs.values()].sort((a, b) => a.name.localeCompare(b.name));
    let files = node.files.slice().sort((a, b) => a.name.localeCompare(b.name));
    if (isRoot) files.sort((a, b) => (a.path === 'SKILL.md' ? -1 : b.path === 'SKILL.md' ? 1 : a.name.localeCompare(b.name)));
    // 目录在前、文件在后
    const entries = [
      ...dirs.map(d => ({type: 'dir', node: d})),
      ...files.map(f => ({type: 'file', ...f})),
    ];
    entries.forEach((e, idx) => {
      const last = idx === entries.length - 1;
      const branch = last ? '└── ' : '├── ';
      if (e.type === 'dir') {
        const row = el('div', 'tree-dir');
        row.append(el('span', 'tree-guide', prefix + branch));
        row.append(el('span', 'tree-dname', e.node.name + '/'));
        nav.append(row);
        renderTree(nav, e.node, prefix + (last ? '    ' : '│   '), false);
      } else {
        const p = e.path, f = current.files[p];
        const dirty = (f.text && f.content !== f.orig) || current.added.has(p);
        const b = el('button', 'fitem' + (p === current.active ? ' active' : '') + (dirty ? ' dirty' : ''));
        b.append(el('span', 'tree-guide', prefix + branch));
        const [kind, ext] = fileKind(p);
        const fi = el('span', 'fkind k-' + kind); fi.textContent = ext;
        const m = el('span', 'fmeta');
        m.append(el('span', 'fname', e.name));
        const sub = el('span', 'fsub');
        if (f.text && f.content != null) { const lines = f.content ? f.content.split('\n').length : 0; sub.textContent = lines + ' 行'; }
        else sub.textContent = fmt(f.size);
        m.append(sub);
        b.append(fi, m);
        if (dirty) b.append(el('span', 'fdot'));
        b.addEventListener('click', async () => { current.active = p; try { await ensureContent(p); } catch (err) { toast(err.message, true); } renderDetail(); });
        nav.append(b);
      }
    });
  }


  // 拆分 Markdown 顶部 YAML frontmatter，返回 {front:[[k,v]], body}
  function splitFrontmatter(text) {
    const m = /^---\r?\n([\s\S]*?)\r?\n---\r?\n?/.exec(text || '');
    if (!m) return {front: null, body: text || ''};
    const front = [];
    for (const line of m[1].split(/\r?\n/)) {
      const i = line.indexOf(':');
      if (i < 0) continue;
      const k = line.slice(0, i).trim();
      let v = line.slice(i + 1).trim();
      if ((v.startsWith('"') && v.endsWith('"')) || (v.startsWith("'") && v.endsWith("'"))) { try { v = JSON.parse(v); } catch { v = v.slice(1, -1); } }
      if (k) front.push([k, v]);
    }
    return {front, body: (text || '').slice(m[0].length)};
  }

  // 只读代码块：行号 + 语言角标（不引语法高亮库）
  function codeBlock(text, lang) {
    const wrap = el('div', 'codeview');
    const bar = el('div', 'code-bar'); bar.append(el('span', 'code-lang', (lang || 'text').toUpperCase()));
    const copy = el('button', 'code-copy'); copy.type = 'button'; copy.innerHTML = icon('copy'); copy.append('复制');
    copy.addEventListener('click', async () => { try { await navigator.clipboard.writeText(text); toast('已复制'); } catch { toast('复制失败', true); } });
    bar.append(copy);
    const lines = (text || '').split('\n');
    const gutter = el('div', 'code-gutter'); gutter.textContent = lines.map((_, i) => i + 1).join('\n');
    const pre = el('pre', 'code-body'); pre.append(el('code', '', text || ''));
    const body = el('div', 'code-scroll'); body.append(gutter, pre);
    wrap.append(bar, body);
    return wrap;
  }

  // 文件类型 → [色系 key, 角标文字]
  function fileKind(path) {
    const name = path.slice(path.lastIndexOf('/') + 1);
    if (name === 'SKILL.md') return ['skill', 'SK'];
    const ext = (name.includes('.') ? name.slice(name.lastIndexOf('.') + 1) : '').toLowerCase();
    const M = {
      py: ['py', 'PY'], md: ['md', 'MD'], json: ['json', '{ }'], txt: ['txt', 'TXT'],
      yaml: ['yaml', 'YML'], yml: ['yaml', 'YML'], csv: ['data', 'CSV'], html: ['web', '<>'],
      css: ['web', 'CSS'], js: ['web', 'JS'], xml: ['data', 'XML'], sql: ['data', 'SQL'],
      png: ['img', 'IMG'], jpg: ['img', 'IMG'], jpeg: ['img', 'IMG'], gif: ['img', 'IMG'],
      webp: ['img', 'IMG'], zip: ['bin', 'ZIP'],
    };
    return M[ext] || ['bin', (ext || 'FILE').slice(0, 3).toUpperCase()];
  }

  async function save() {
    const name = current.meta.name;
    const changed = Object.entries(current.files)
      .filter(([p, f]) => !current.deleted.has(p) && f.text && f.content != null && (f.content !== f.orig || current.added.has(p)))
      .map(([path, f]) => ({path, content: f.content}));
    if (!changed.length && !current.deleted.size) { toast('没有需要保存的修改'); return; }
    try {
      await jpost('/api/skills/' + encodeURIComponent(name), {files: changed, delete: [...current.deleted]}, 'PUT');
      current.added.clear(); current.deleted.clear();
      toast('已保存');
      current = null; // 避免 dirty 提示
      await loadList(name);
    } catch (e) { toast(e.message, true); }
  }

  function addFile() {
    ask('新建文件', [{key: 'path', label: '文件路径（相对技能根目录）', placeholder: 'scripts/main.py 或 references/guide.md'}], async v => {
      const p = v.path.replace(/^\/+/, '');
      if (!p || p.split('/').some(s => !s || s === '..' || s.startsWith('.'))) throw new Error('路径不合法');
      if (!TEXT_EXT.test(p)) throw new Error('在线只能新建文本文件（.py .md .json .txt 等）');
      if (current.files[p] && !current.deleted.has(p)) throw new Error('文件已存在');
      current.deleted.delete(p);
      current.files[p] = {text: true, size: 0, content: p.endsWith('.py') ? '"""说明：用法 python ' + p.split('/').pop() + ' 输出文件名"""\nimport sys\n\n' : '', orig: null};
      current.added.add(p); current.active = p; renderDetail();
    });
  }

  function fork() {
    const base = current.meta.name.replace(/^my-/, '');
    ask('复制为我的技能', [{key: 'name', label: '新技能名（小写字母、数字、连字符）', value: 'my-' + base}], async v => {
      if (!NAME_RE.test(v.name)) throw new Error('名称只能包含小写字母、数字和连字符');
      await jpost('/api/skills/' + encodeURIComponent(current.meta.name) + '/fork', {new_name: v.name});
      toast('已复制为 ' + v.name); current = null; await loadList(v.name);
    });
  }

  async function removeSkill() {
    if (!confirm('确定删除技能 ' + current.meta.name + '？此操作不可恢复。')) return;
    try {
      await api('/api/skills/' + encodeURIComponent(current.meta.name), {method: 'DELETE'});
      toast('已删除'); current = null; history.replaceState(null, '', location.pathname);
      location.reload();
    } catch (e) { toast(e.message, true); }
  }

  $('newSkillBtn').addEventListener('click', () => {
    if (dirty() && !confirm('有未保存的修改，确定放弃？')) return;
    ask('新建技能', [
      {key: 'name', label: '技能名（小写字母、数字、连字符）', placeholder: 'meeting-minutes'},
      {key: 'desc', label: '描述：做什么 + 什么时候用（AI 靠它判断是否调用）', multiline: true, placeholder: '把会议要点整理成规范的会议纪要 Word 文档。用户说"整理会议纪要"时使用。'},
    ], async v => {
      if (!NAME_RE.test(v.name)) throw new Error('名称只能包含小写字母、数字和连字符');
      if (!v.desc) throw new Error('描述不能为空');
      const desc = v.desc.replace(/\s+/g, ' ');
      const md = `---\nname: ${v.name}\ndescription: ${JSON.stringify(desc)}\n---\n\n# ${v.name}\n\n## 流程\n1. 向用户确认需要的信息\n2. 调用 \`run_skill_script\`（name: \`${v.name}\`，script: \`scripts/main.py\`，args: ["输出文件名"]，stdin: JSON）\n3. 简要说明结果\n\n## 输入规格\n（在这里写 JSON 示例）\n`;
      await jpost('/api/skills', {files: [{path: 'SKILL.md', content: md}]});
      current = null; toast('已创建 ' + v.name); await loadList(v.name);
    });
  });

  $('importBtn').addEventListener('click', () => $('importInput').click());
  $('importInput').addEventListener('change', async () => {
    const f = $('importInput').files[0]; $('importInput').value = '';
    if (!f) return;
    const fd = new FormData(); fd.append('file', f);
    try {
      const s = await api('/api/skills/import', {method: 'POST', body: fd});
      toast('已导入 ' + s.name); current = null; await loadList(s.name);
    } catch (e) { toast(e.message, true); }
  });

  const initial = decodeURIComponent(location.hash.slice(1));
  loadList(NAME_RE.test(initial) ? initial : null);
})();
</script>
</body>
</html>

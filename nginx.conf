# 按 IP 限流（应用层还有更细的每分钟/每日配额）
limit_req_zone  $binary_remote_addr zone=api:10m  rate=10r/s;
limit_req_zone  $binary_remote_addr zone=chat:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=conn:10m;

server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # gzip 压缩，减小传输体积
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript image/svg+xml application/json;

    # HTML 不缓存，保证内容更新即时生效
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    }

    # 图片等静态资源缓存 7 天
    location ~* \.(?:png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # 基础安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    limit_req_status  429;
    limit_conn_status 429;

    # 对话接口：SSE 流式，单独限流
    location = /api/chat {
        limit_req  zone=chat burst=3 nodelay;
        limit_conn conn 4;
        client_max_body_size 64k;
        proxy_pass         http://agent-api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 900s;       # Agent 多轮工具调用可能较久
        add_header X-Accel-Buffering no;
    }

    # 其他 API（会话、文件、技能）
    location /api/ {
        limit_req  zone=api burst=30 nodelay;
        client_max_body_size 12m;      # 文件/技能 zip 上传上限（应用层为 10MB）
        proxy_pass         http://agent-api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
